<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>&#49688;&#54617;&#47928;&#51228; &#45813;&#50504;&#49440;&#53469;</title>
  <style>
    :root {
      --bg: #f3f4f6;
      --paper: #ffffff;
      --ink: #111827;
      --muted: #4b5563;
      --line: #cfd5dd;
      --green: #008000;
      --blue: #1d4ed8;
      --soft: #eef4ff;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Malgun Gothic", "Segoe UI", system-ui, sans-serif;
      overflow: hidden;
    }
    button, input { font: inherit; }
    .layout {
      height: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 132px;
      gap: 4px;
      padding: 2px;
    }
    .question-area {
      min-height: 0;
      background: var(--paper);
      border: 1px solid var(--line);
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }
    .question-head {
      min-height: 38px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 10px;
    }
    .question-title {
      font-weight: 800;
      font-size: 16px;
    }
    .hint {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }
    .problem-view {
      min-height: 0;
      overflow: auto;
      padding: 14px;
      background: #fff;
    }
    .problem-image {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 0 auto;
    }
    .answer-sheet {
      min-height: 0;
      background: var(--paper);
      border: 1px solid var(--line);
      display: grid;
      grid-template-rows: 30px minmax(0, 1fr) auto;
      overflow: hidden;
    }
    .subject {
      display: grid;
      place-items: center;
      border-bottom: 1px solid var(--line);
      color: var(--green);
      font-weight: 800;
      font-size: 14px;
    }
    .answer-rows {
      min-height: 0;
      overflow-y: auto;
    }
    .answer-row {
      display: grid;
      grid-template-columns: 25px repeat(5, 20px);
      align-items: center;
      min-height: 25px;
      border-bottom: 1px solid #e5e7eb;
      background: #fff;
    }
    .answer-row.current {
      background: var(--soft);
      outline: 2px solid rgba(29, 78, 216, .25);
      outline-offset: -2px;
    }
    .answer-row.answered .num {
      background: #ecfdf5;
    }
    .num {
      height: 100%;
      border: 0;
      border-right: 1px solid #e5e7eb;
      background: transparent;
      color: var(--green);
      font-weight: 800;
      cursor: pointer;
      padding: 0;
      font-size: 14px;
    }
    .bubble {
      position: relative;
      display: grid;
      place-items: center;
      height: 24px;
      cursor: pointer;
      user-select: none;
      font-size: 13px;
      line-height: 1;
    }
    .bubble input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }
    .bubble span {
      width: 17px;
      height: 17px;
      display: grid;
      place-items: center;
      border-radius: 50%;
    }
    .bubble input:checked + span {
      background: var(--ink);
      color: #fff;
      font-weight: 800;
    }
    .sheet-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      padding: 4px;
      border-top: 1px solid var(--line);
    }
    .sheet-actions button {
      min-height: 28px;
      border: 1px solid var(--line);
      background: #fff;
      cursor: pointer;
      font-size: 12px;
    }
    @media (max-width: 760px) {
      body { overflow: auto; }
      .layout {
        min-height: 100%;
        height: auto;
        grid-template-columns: 1fr;
      }
      .answer-sheet {
        min-height: 340px;
      }
    }
  </style>
</head>
<body>
  <main class="layout">
    <section class="question-area">
      <div class="question-head">
        <div class="question-title" id="questionTitle">1&#48264; &#47928;&#51228;</div>
        <div class="hint"><span id="answeredCount">0</span> / 20</div>
      </div>
      <div class="problem-view">
        <img id="problemImage" class="problem-image" alt="&#49688;&#54617; &#47928;&#51228;" />
      </div>
    </section>

    <aside class="answer-sheet">
      <div class="subject">1&#44284;&#47785;</div>
      <div class="answer-rows" id="answerRows"></div>
      <div class="sheet-actions">
        <button id="resetBtn" type="button">&#52488;&#44592;&#54868;</button>
        <button id="nextBtn" type="button">&#45796;&#51020;</button>
      </div>
    </aside>
  </main>

  <script>
    const problems = [{"number": 1, "page": 1, "image": "assets/problem_01.png", "width": 749, "height": 238}, {"number": 2, "page": 1, "image": "assets/problem_02.png", "width": 749, "height": 336}, {"number": 3, "page": 1, "image": "assets/problem_03.png", "width": 746, "height": 315}, {"number": 4, "page": 1, "image": "assets/problem_04.png", "width": 746, "height": 336}, {"number": 5, "page": 2, "image": "assets/problem_05.png", "width": 749, "height": 378}, {"number": 6, "page": 2, "image": "assets/problem_06.png", "width": 749, "height": 385}, {"number": 7, "page": 2, "image": "assets/problem_07.png", "width": 746, "height": 378}, {"number": 8, "page": 3, "image": "assets/problem_08.png", "width": 749, "height": 343}, {"number": 9, "page": 3, "image": "assets/problem_09.png", "width": 749, "height": 441}, {"number": 10, "page": 3, "image": "assets/problem_10.png", "width": 746, "height": 343}, {"number": 11, "page": 4, "image": "assets/problem_11.png", "width": 749, "height": 364}, {"number": 12, "page": 4, "image": "assets/problem_12.png", "width": 746, "height": 630}, {"number": 13, "page": 5, "image": "assets/problem_13.png", "width": 749, "height": 371}, {"number": 14, "page": 5, "image": "assets/problem_14.png", "width": 746, "height": 1155}, {"number": 15, "page": 6, "image": "assets/problem_15.png", "width": 749, "height": 399}, {"number": 16, "page": 6, "image": "assets/problem_16.png", "width": 746, "height": 490}, {"number": 17, "page": 7, "image": "assets/problem_17.png", "width": 749, "height": 392}, {"number": 18, "page": 7, "image": "assets/problem_18.png", "width": 746, "height": 910}, {"number": 19, "page": 8, "image": "assets/problem_19.png", "width": 749, "height": 434}, {"number": 20, "page": 8, "image": "assets/problem_20.png", "width": 746, "height": 434}];
    const total = 20;
    const storageKey = "math-20-answer-sheet-ui";
    const labels = ["①", "②", "③", "④", "⑤"];
    let current = 1;
    let answers = loadAnswers();

    function loadAnswers() {
      try {
        return JSON.parse(localStorage.getItem(storageKey) || "{}");
      } catch {
        return {};
      }
    }

    function saveAnswers() {
      localStorage.setItem(storageKey, JSON.stringify(answers));
      renderRows();
      updateCount();
    }

    function updateCount() {
      document.getElementById("answeredCount").textContent = Object.keys(answers).length;
    }

    function getProblem(number) {
      return problems.find(problem => problem.number === number);
    }

    function selectProblem(number) {
      current = number;
      const problem = getProblem(number);
      document.getElementById("questionTitle").textContent = `${number}번 문제`;
      const image = document.getElementById("problemImage");
      image.src = problem.image;
      image.width = problem.width;
      image.height = problem.height;
      image.alt = `${number}번 문제`;
      document.querySelector(".problem-view").scrollTop = 0;
      renderRows();
    }

    function chooseAnswer(number, value) {
      answers[number] = value;
      current = number;
      selectProblem(number);
      saveAnswers();
    }

    function renderRows() {
      const box = document.getElementById("answerRows");
      box.innerHTML = "";
      for (let number = 1; number <= total; number++) {
        const row = document.createElement("div");
        row.className = "answer-row";
        row.classList.toggle("current", number === current);
        row.classList.toggle("answered", Boolean(answers[number]));

        const num = document.createElement("button");
        num.type = "button";
        num.className = "num";
        num.textContent = number;
        num.addEventListener("click", () => selectProblem(number));
        row.appendChild(num);

        labels.forEach((label, index) => {
          const value = String(index + 1);
          const bubble = document.createElement("label");
          bubble.className = "bubble";
          bubble.title = `${number}번 ${value}번`;
          bubble.innerHTML = `
            <input type="radio" name="answer-${number}" value="${value}" ${answers[number] === value ? "checked" : ""} />
            <span>${label}</span>
          `;
          bubble.querySelector("input").addEventListener("change", () => chooseAnswer(number, value));
          row.appendChild(bubble);
        });

        box.appendChild(row);
      }
    }

    document.getElementById("resetBtn").addEventListener("click", () => {
      answers = {};
      localStorage.removeItem(storageKey);
      renderRows();
      updateCount();
    });

    document.getElementById("nextBtn").addEventListener("click", () => {
      selectProblem(current === total ? 1 : current + 1);
    });

    updateCount();
    selectProblem(1);
  </script>
</body>
</html>
